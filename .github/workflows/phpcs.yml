name: PHPCS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer lint
